# Deploy do front no Netlify (o passo a passo está no README).
# A URL do back no Render NÃO fica aqui: configure VITE_BACK_URL no painel do Netlify
# (Site configuration → Environment variables). Sem ela o build falha de propósito.

[build]
  base = "front"            # instala as dependências e roda o build dentro de front/
  command = "npm run build"
  publish = "dist"          # relativo ao base, ou seja, front/dist

[build.environment]
  NODE_VERSION = "22"

# O front usa rotas na URL (/loja, /batalhas/12...): qualquer caminho que não seja um arquivo
# devolve o index.html, senão recarregar a página numa tela dá 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança apontados pelo OWASP ZAP (os mesmos do front/vercel.json e do Vite)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Resource-Policy = "same-origin"
