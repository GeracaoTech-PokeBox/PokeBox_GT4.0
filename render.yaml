# Blueprint do Render para o back (o passo a passo está no README).
# Render → New → Blueprint → escolha este repositório. Ele pede o DATABASE_URL na criação.

services:
  - type: web
    name: pokebox-back
    runtime: node
    plan: free
    region: virginia        # mesma região do banco no Neon (AWS US East 1), para as consultas serem rápidas
    rootDir: back           # só mudanças em back/ disparam um novo deploy
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /api/saude
    envVars:
      - key: DATABASE_URL
        sync: false         # connection string do Neon, preenchida no painel (não vai para o Git)
      - key: NODE_VERSION
        value: "22"
