services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pokebox
      POSTGRES_PASSWORD: pokebox
      POSTGRES_DB: pokebox
    ports:
      - "5432:5432"
    volumes:
      - ./db/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokebox -d pokebox"]
      interval: 2s
      timeout: 3s
      retries: 20

  back:
    build: ./back
    environment:
      DATABASE_URL: postgres://pokebox:pokebox@db:5432/pokebox
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    environment:
    
      BACK_URL: http://back:8080
    ports:
      - "5174:5174"
    depends_on:
      - back
  tunel:
    image: cloudflare/cloudflared:2025.4.0
    profiles: [online]
    command: tunnel --no-autoupdate --url http://back:8080
    depends_on:
      - back

volumes:
  dados:
